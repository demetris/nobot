  ##    Skip all rules for Accept-Encoding
  ##
  ##  - - - - - - - - - - - - - - - - - ---- - - - - - - - - - - - - - - - - - - -

  RewriteCond %{REQUEST_SCHEME}       "=https"
  RewriteCond %{HTTP:Accept-Encoding} "=gzip, deflate, br"

  RewriteCond %{ENV:UA_IS_CHROME_59_TO_122}           "=1"                        [OR]
