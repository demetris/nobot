    RewriteCond %{HTTP_USER_AGENT}  "=pc"                                                               [OR]

    ##
    ##  Made up: Chrome
    ##

    RewriteCond %{HTTP_USER_AGENT}  "^Mozilla/4\.0 \([^)]+\) AppleWebKit/[^ ]+ \(K[^o]+o\) Chrome/[0-9]\.[^ ]+ Safari/[^ ]+$"                                                   [OR]

    RewriteCond %{HTTP_USER_AGENT}  "^Mozilla/5\.0 \([^)]+\) Chrome/91\.[^ ]+$"                                                                                                 [OR]

