  ^<HOST> - .* ".*HTTP/1\.1" 451 [0-9]+ "[^"]*" "Mozilla/5\.0 .* CriOS/
  ^<HOST> - .* ".*HTTP/1\.1" 451 [0-9]+ "[^"]*" "Mozilla/5\.0 .* Encrypt validation server
  ^<HOST> - .* ".*HTTP/1\.1" 451 [0-9]+ "[^"]*" "Mozilla/5\.0 .* Gecko/[0-9]+
  ^<HOST> - .* ".*HTTP/1\.1" 451 [0-9]+ "[^"]*" "Mozilla/5\.0 .* Firefox/[0-9]\.
