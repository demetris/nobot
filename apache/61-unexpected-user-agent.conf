    RewriteCond %{HTTP_USER_AGENT}  "^Mozilla/5\.0 \((?:Mac|Win)[^)]+\) AppleWebKit/[^ ]+ Chrome/1[0-4][0-9] Safari/[^ ]+$"                                                     [OR]

    ##  Misses “Safari/537.36” at the end.
